services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      FRONTEND_URL: http://localhost:8080

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    image: citizenconnect
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: http://backend:5000
    depends_on:
      - backend
