services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/citizenconnect
      FRONTEND_URL: http://localhost:8080
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    image: citizenconnect
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: http://backend:5000
    depends_on:
      - backend

volumes:
  mongo_data:
